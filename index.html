<style>
  :root{
    --broth:#FFF7E8;
    --card:#FFFFFF;
    --ink:#2A1A10;
    --sub:#8A7A6B;
    --line:#EDE2D0;
    --chili:#B8331F;
    --chili-dark:#8C2515;
    --yolk:#F2A93B;
    --yolk-soft:#FCE9C6;
    --scallion:#4C7A4A;
    --scallion-soft:#E4EFDE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;
    background:#E8DCC5;
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .device{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--broth);
    position:relative;
    padding-bottom:76px;
    box-shadow:0 0 40px rgba(0,0,0,0.25);
  }
  header.top{
    padding:16px 20px 10px;
    position:sticky;
    top:0;
    background:var(--broth);

    border-bottom:1px solid var(--line);
  }
  .brand{
    font-family:"Do Hyeon",sans-serif;
    font-size:22px;
    color:var(--chili);
    letter-spacing:0.5px;
    margin:0 0 2px;
  }
  .tagline{
    font-size:12px;
    color:var(--sub);
    margin:0 0 12px;
  }
  .brand-mini{
    font-family:"Do Hyeon",sans-serif;
    font-size:12.5px;
    color:var(--sub);
    letter-spacing:0.3px;
    margin:0 0 2px;
  }
  .page-title{
    font-size:20px;
    font-weight:800;
    color:var(--ink);
    margin:0 0 12px;
  }
  .searchbar{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
  }
  .searchbar input{
    border:none;
    outline:none;
    flex:1;
    font-size:14px;
    background:transparent;
    color:var(--ink);
  }
  .searchbar input::placeholder{color:#C2B49E;}
  main{padding:10px 20px 8px;}
  .tags{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:16px;
  }
  .tag{
    flex:none;
    font-size:13px;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--sub);
    cursor:pointer;
    white-space:nowrap;
  }
  .tag.active{
    background:var(--chili);
    border-color:var(--chili);
    color:#fff;
    font-weight:600;
  }
  .section-title{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    margin:18px 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .section-title span.count{font-weight:400;color:var(--sub);font-size:12px;}
  .combo-card{
    display:flex;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;

  }

  .thumb{
    width:52px;height:52px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;flex:none;
    background-size:cover;background-position:center;background-repeat:no-repeat;

  .combo-body{flex:1;min-width:0;}
  .combo-title{

    display:flex;align-items:center;gap:6px;

  .badge-pending{

  .empty{

    width:22px;height:22px;border-radius:50%;background:var(--chili);color:#fff;

    position:fixed;bottom:0;left:50%;transform:translateX(-50%);

  .nav-btn .ic{font-size:20px;}
  .nav-btn.active{color:var(--chili);font-weight:700;}
  .toast{

    background:#FFF3DD;border:1px solid #E9D4AA;border-radius:14px;
    padding:12px 14px;margin:0 0 14px;font-size:12px;line-height:1.6;color:#6E4C20;

  .source-note{
    background:#F7F7F7;border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;font-size:12px;line-height:1.6;color:var(--sub);margin-top:10px;
  }
</style>
</head>

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove("show"),1600);
}
function fmtTime(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function fmtQty(n){
  const r = Math.round(n*10)/10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}
function playBeep(){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    [0,0.18,0.36].forEach((delay,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value = i===2 ? 1046 : 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime+delay);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+delay+0.16);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+delay);
      o.stop(ctx.currentTime+delay+0.18);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 800);
  }catch(e){}
}
function vibrateDone(){
  try{ if(navigator.vibrate) navigator.vibrate([200,80,200,80,300]); }catch(e){}
}

    if(c.status!=="게시") return false;
    return category==="전체" || c.category===category;
  });
}

function renderFav(){
  const list = combos.filter(c=>state.favorites.has(c.id));
  return `
  <header class="top"><p class="brand-mini">별라요</p><p class="page-title">즐겨찾기</p></header>
  <main>
    <div class="section-title">저장한 조합 <span class="count">${list.length}개</span></div>
    ${list.length? list.map(comboCardHtml).join("") : `<div class="empty">아직 저장한 조합이 없어요.<br>홈에서 ★ 버튼을 눌러보세요.</div>`}
  </main>`;
}

function renderFridge(){
  const sel = state.fridgeSelected;
  const grid = FRIDGE_ITEMS.map(f=>`
    <div class="fitem ${sel.has(f.id)?'sel':''}" data-fridge="${f.id}">
      <span class="ic">${f.ic}</span>${f.name}
    </div>`).join("");

  let resultHtml="";
  if(state.fridgeResult){
    resultHtml = state.fridgeResult.length
      ? `<div id="fridgeResultSection" class="section-title">선택한 재료가 포함된 조합 <span class="count">${state.fridgeResult.length}개</span></div>` + state.fridgeResult.map(comboCardHtml).join("")
      : `<div id="fridgeResultSection" class="empty">선택한 재료가 들어가는 조합이 아직 없어요.<br>다른 재료를 선택하거나 홈에서 인기 조합을 확인해보세요.</div>`;
  }

  return `
  <header class="top"><p class="brand-mini">별라요</p><p class="page-title">냉장고 재료 추천</p></header>
  <main>
    <div class="section-title">보유한 재료를 선택하세요</div>
    <div class="fridge-grid">${grid}</div>
    <button class="rec-btn" id="fridgeBtn">선택 재료로 조합 찾기</button>
    ${resultHtml}
  </main>`;
}

function renderAdd(){
  const f=state.form;
  return `
  <header class="top"><p class="brand-mini">별라요</p><p class="page-title">내 꿀조합 등록</p></header>
  <main>
    <label class="f">조합 이름</label>
    <input class="f" id="f_title" placeholder="예: 참깨라면 해장조합" value="${f.title}">

    <label class="f">사용한 라면(브랜드) 구성</label>
    <input class="f" id="f_base" placeholder="예: 참깨라면 + 콩나물 + 계란" value="${f.base}">

    <label class="f">태그</label>
    <div class="chiprow">
      ${TAGS.filter(t=>t!=="전체").map(t=>`<div class="chip-toggle ${f.tags.has(t)?'on':''}" data-formtag="${t}">${t}</div>`).join("")}
    </div>

    <label class="f">재료(줄바꿈으로 구분)</label>
    <textarea class="f" id="f_ing" placeholder="라면 1개&#10;계란 1개&#10;대파 약간">${f.ingredients}</textarea>

    <label class="f">조리 순서(줄바꿈으로 구분)</label>
    <textarea class="f" id="f_steps" placeholder="물이 끓으면 면과 스프를 넣는다&#10;계란을 풀어 넣는다">${f.steps}</textarea>

    <button class="submit-btn" id="submitCombo">조합 등록하기</button>
    <p class="hint">등록한 조합은 운영자 검수 후 "게시" 상태로 전환되어 홈 화면에 노출됩니다. (이 프로토타입에서는 등록 즉시 검수중 상태로 홈 목록에 표시됩니다)</p>
  </main>`;
}

function renderDetail(){
  const c = combos.find(x=>x.id===state.detailId);
  if(!c) { state.tab="home"; return renderHome(); }
  const fav = state.favorites.has(c.id);
  const metaRow = c.isGuide
    ? `<div class="rating-row">📖 ${c.category} · ${c.base}</div>`
    : `<div class="rating-row">${factLabel(c)} · ${c.base}</div>`;
  const footer = c.isGuide
    ? `<p class="hint">제품마다 물 양·스프 투입 순서·조리시간이 다를 수 있습니다. 이 가이드는 제조사 포장지 조리법을 우선하면서 응용할 때 참고하는 기본 원칙입니다.</p>
       <div class="source-note">${factNote(c)}</div>`
    : `<a class="buy-btn" href="${c.buyUrl}" target="_blank" rel="noopener">🛒 재료상품찾기</a>
       <p class="hint">이 포스팅은 네이버 쇼핑 커넥트 활동의 일환으로, 판매 발생 시 수수료를 제공받지만, 상품금액에 영향을 주지 않습니다.</p>
       <div class="source-note">${factNote(c)}</div>
       <div class="source-note">건강 참고: 라면과 햄·치즈·김치·마라소스 등을 함께 사용하면 나트륨 섭취량이 높아질 수 있으므로 영양정보를 확인하고 스프·소스 양을 조절하세요.</div>`;

  const servingsRow = c.isGuide ? "" : `
    <div class="stepper-row">
      <span class="stepper-label">몇 인분?</span>
      <div class="stepper">
        <button class="stepper-btn" data-serv="-1" ${state.servings<=1?'disabled':''}>−</button>
        <span class="stepper-val">${state.servings}인분</span>
        <button class="stepper-btn" data-serv="1" ${state.servings>=4?'disabled':''}>+</button>
      </div>
    </div>`;

  const ingRows = c.ingredients.map(ing=>{
    let amountText;
    if(ing.q!=null){
      amountText = fmtQty(ing.q*state.servings)+(ing.u||"");
      if(ing.note) amountText += ` (${ing.note})`;
    } else {
      amountText = ing.note || "";
    }
    return `<div class="ing-row"><span>${ing.n}</span><span>${amountText}</span></div>`;
  }).join("");

  const secs = c.steps.map(s=>s.sec);
  const maxSec = Math.max(...secs);
  const boilIdx = secs.indexOf(maxSec);
  const doneLabel = state.doneness<0 ? "꼬들" : state.doneness>0 ? "부들" : "보통";

  const stepsHtml = c.steps.map((s,i)=>{
    const isBoil = i===boilIdx && maxSec>0;
    const sec = isBoil ? Math.max(30, s.sec+state.doneness) : s.sec;
    return `
      <div class="step">
        <div class="step-num">${i+1}</div>
        <div class="step-text">${s.t}</div>
        ${sec>0?`<button class="timer-chip" data-timer="${sec}">⏱ ${fmtTime(sec)}</button>`:''}
      </div>`;
  }).join("");

  const doneToggle = maxSec>0 ? `
    <div class="doneness-row">
      <span class="stepper-label">면 익힘(면 삶는 단계에 적용, 현재: ${doneLabel})</span>
      <div class="doneness-btns">
        <button class="doneness-btn ${state.doneness===-30?'on':''}" data-done="-30">꼬들 −30초</button>
        <button class="doneness-btn ${state.doneness===0?'on':''}" data-done="0">보통</button>
        <button class="doneness-btn ${state.doneness===30?'on':''}" data-done="30">부들 +30초</button>
      </div>
    </div>` : "";

  return `
  <div class="detail-hero" style="background-image:url('${thumbUri(c)}');position:relative;">
    <button class="back-btn" data-back="1">⬅️</button>
    <span>${c.emoji}</span>
  </div>
  <div class="detail-body">
    <div class="detail-title">${c.title} <button class="star-btn ${fav?'on':''}" data-fav="${c.id}" style="vertical-align:-2px;">★</button></div>
    ${metaRow}
    <div class="detail-tags">${c.tags.map(t=>`<span class="pill">${t}</span>`).join("")}</div>
    ${servingsRow}

    <div class="card-block">
      <h4>재료${c.isGuide?'':` (${state.servings}인분 기준)`}</h4>
      ${ingRows}
    </div>

    <div class="card-block">
      <h4>조리 순서</h4>
      ${doneToggle}
      ${stepsHtml}
    </div>

    ${footer}
  </div>`;
}

/* ---------------- 이벤트 바인딩 ---------------- */
function bindEvents(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.onclick=()=>{ state.tab=el.dataset.nav; render(); };
  });
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.onclick=(e)=>{
      if(e.target.closest("[data-fav]")) return;
      state.detailId=Number(el.dataset.open);
      state.servings=1;
      state.doneness=0;
      state.tab="detail";
      render();
    };
  });
  document.querySelectorAll("[data-fav]").forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const id=Number(el.dataset.fav);
      if(state.favorites.has(id)){ state.favorites.delete(id); showToast("즐겨찾기에서 제거했어요"); }
      else { state.favorites.add(id); showToast("즐겨찾기에 저장했어요"); }
      render();
    };
  });
  document.querySelectorAll("[data-tag]").forEach(el=>{
    el.onclick=()=>{ state.activeTag=el.dataset.tag; render(); };
  });
  const searchInput=document.getElementById("searchInput");
  if(searchInput){
    searchInput.oninput=(e)=>{ state.search=e.target.value; render(); searchInput.focus(); searchInput.setSelectionRange(state.search.length,state.search.length); };
  }
  const backBtn=document.querySelector("[data-back]");
  if(backBtn){ backBtn.onclick=()=>{ state.tab="home"; render(); }; }

  document.querySelectorAll("[data-serv]").forEach(el=>{
    el.onclick=()=>{
      const delta=Number(el.dataset.serv);
      state.servings=Math.min(4,Math.max(1,state.servings+delta));
      render();
    };
  });
  document.querySelectorAll("[data-done]").forEach(el=>{
    el.onclick=()=>{
      state.doneness=Number(el.dataset.done);
      render();
    };
  });

  document.querySelectorAll("[data-fridge]").forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.fridge;
      if(state.fridgeSelected.has(id)) state.fridgeSelected.delete(id);
      else state.fridgeSelected.add(id);
      state.fridgeResult=null;
      render();
    };
  });
  const fridgeBtn=document.getElementById("fridgeBtn");
  if(fridgeBtn){
    fridgeBtn.onclick=()=>{
      const sel=state.fridgeSelected;
      if(sel.size===0){
        showToast("보유한 재료를 먼저 선택해주세요");
        state.fridgeResult=null;
        render();
        return;
      }
      state.fridgeResult = combos
        .filter(c=>c.status==="게시" && c.needFridge.some(n=>sel.has(n)))
        .sort((a,b)=> b.needFridge.filter(n=>sel.has(n)).length - a.needFridge.filter(n=>sel.has(n)).length);
      showToast(state.fridgeResult.length ? `${state.fridgeResult.length}개 조합을 찾았어요` : "맞는 조합이 없어요");
      render();
      const target = document.getElementById("fridgeResultSection");
      if(target && typeof target.scrollIntoView==="function"){
        try{ target.scrollIntoView({behavior:"smooth", block:"start"}); }catch(e){}
      }
    };
  }

  document.querySelectorAll("[data-formtag]").forEach(el=>{
    el.onclick=()=>{
      const t=el.dataset.formtag;
      if(state.form.tags.has(t)) state.form.tags.delete(t);
      else state.form.tags.add(t);
      render();
    };
  });
  ["f_title","f_base","f_ing","f_steps"].forEach(id=>{
    const el=document.getElementById(id);
    if(el){
      el.oninput=(e)=>{
        const map={f_title:"title",f_base:"base",f_ing:"ingredients",f_steps:"steps"};
        state.form[map[id]]=e.target.value;
      };
    }
  });
  const submitBtn=document.getElementById("submitCombo");
  if(submitBtn){
    submitBtn.onclick=()=>{
      const f=state.form;
      if(!f.title.trim() || !f.base.trim()){
        showToast("조합 이름과 라면 구성을 입력해주세요");
        return;
      }
      const ingredients = f.ingredients.split("\n").filter(x=>x.trim()).map(x=>({n:x.trim(), q:null, note:null}));
      const steps = f.steps.split("\n").filter(x=>x.trim()).map(x=>({t:x.trim(),sec:0}));
      combos.push({
        id:nextId++, title:f.title.trim(), emoji:"🍜",
        tags: f.tags.size? Array.from(f.tags) : ["국물"],
        base:f.base.trim(), status:"검수중", userSubmitted:true,
        ingredients: ingredients.length? ingredients : [{n:"재료 미입력", q:null, note:null}],
        needFridge:[],
        steps: steps.length? steps : [{t:"조리 순서 미입력",sec:0}],
        buyUrl:"#naver-shopping-connect-placeholder"
      });
      state.form={title:"",base:"",tags:new Set(),ingredients:"",steps:""};
      state.tab="home";
      showToast("조합이 등록되어 검수 대기 중이에요");
      render();
    };
  }

  document.querySelectorAll("[data-timer]").forEach(el=>{
    el.onclick=()=>{
      let sec=Number(el.dataset.timer);
      if(el.__running) return;
      el.__running=true;
      el.textContent="⏱ "+fmtTime(sec);
      const iv=setInterval(()=>{
        sec--;
        if(sec<0){
          clearInterval(iv);
          el.__running=false;
          el.textContent="✅ 완료";
          playBeep();
          vibrateDone();
          showToast("타이머 완료!");
          return;
        }
        el.textContent="⏱ "+fmtTime(sec);
      },1000);
    };
  });
}

render();
</script>
</body>
</html>
